<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".12"/><stop offset="100%" stop-color="#fff" stop-opacity=".03"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#818cf8"/><stop offset="50%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(12px)}}@keyframes dashMove{0%{stroke-dashoffset:100}}.floating-card-1{animation:floatCard1 6s ease-in-out infinite}.floating-card-1,.floating-card-2,.pulse-circle{transform-box:fill-box;transform-origin:center}.floating-card-2{animation:floatCard2 7s ease-in-out infinite}.pulse-circle{animation:pulseGlow 4s ease-in-out infinite}.pill-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:52px;fill:#fff}.subtitle-text{font-weight:500;font-size:22px;fill:#cbd5e1}.pill-text{font-weight:600;font-size:14px;fill:#e2e8f0}</style><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><g class="pulse-circle" opacity=".4"><circle cx="200" cy="100" r="180" fill="#6366f1" filter="url(#glow)"/><circle cx="1000" cy="300" r="220" fill="#a855f