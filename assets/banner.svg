<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Card/Pill Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Dynamic Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .floating-card-1 { animation: floatCard1 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .floating-card-2 { animation: floatCard2 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse-circle { animation: pulseGlow 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #cbd5e1; }
    .pill-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic/Animated Background Graphics (Kept in Background) -->
  <g class="pulse-circle" opacity="0.4">
    <circle cx="200" cy="100" r="180" fill="#6366f1" filter="url(#glow)"/>
    <circle cx="1000" cy="300" r="220" fill="#a855f7" filter="url(#glow)"/>
  </g>

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Dynamic Background Floating Cards (Positioned lower/side so title stays in foreground) -->
  <g class="floating-card-1" opacity="0.6">
    <rect x="80" y="270" width="220" height="70" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="100" y="300" class="pill-text" fill="#818cf8">⚡ 3-Way Matching Engine</text>
    <text x="100" y="322" font-family="sans-serif" font-size="12" fill="#94a3b8">&lt;500ms Execution Time</text>
  </g>

  <g class="floating-card-2" opacity="0.6">
    <rect x="900" y="260" width="220" height="70" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="920" y="290" class="pill-text" fill="#f472b6">🤖 AI Vendor Scoring</text>
    <text x="920" y="312" font-family="sans-serif" font-size="12" fill="#94a3b8">Automated RFQ Insights</text>
  </g>

  <!-- Foreground Title and Subtitle Header Group -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Top Accent Line -->
    <rect x="-150" y="-70" width="300" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Category Pill -->
    <rect x="-140" y="-52" width="280" height="32" rx="16" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="0" y="-31" class="pill-text" text-anchor="middle">🛒 CLOUD PROCUREMENT &amp; SPEND</text>

    <!-- Main Title -->
    <text x="0" y="35" class="title-text">Awesome Cloud Purchasing</text>

    <!-- Subtitle -->
    <text x="0" y="75" class="subtitle-text">Curated SaaS Platforms, Self-Hosted ERPs &amp; Open-Source P2P Engines</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="392" width="1200" height="8" fill="url(#accent-grad)"/>
</svg>
